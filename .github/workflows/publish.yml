name: Publish

# Publishes the @superwall/* packages to npm. Runs automatically on merge to
# main and can be triggered manually (with an optional dry run).
#
# Idempotent: a package is only published when its package.json version isn't
# already on npm — so merges that don't bump a version are no-ops. Bump the
# version in a package's package.json to release it.
#
# Auth is npm trusted publishing (OIDC) — no NPM_TOKEN secret. Each package on
# npmjs.com is configured with a trusted publisher pointing at this repo,
# workflow `publish.yml`, environment `Publish`. That requires:
#   - the `Publish` environment on the job
#   - `id-token: write` permission
#   - npm CLI >= 11.5.1 (Node 24 ships it)
#   - a GitHub-hosted runner

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack + resolve but do NOT publish"
        type: boolean
        default: false

# Never run two publishes at once.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Publish
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Must be ≥1.2 to read the text bun.lock format; keep in sync with
          # `packageManager` in the root package.json.
          bun-version: "1.3.11"

      # Node 24 ships npm >= 11.5.1, the first npm CLI that can do the OIDC
      # token exchange for trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Publish changed packages
        # `bun publish` can't do the OIDC exchange, and `npm publish` can't
        # resolve `workspace:*` deps — so pack with bun (which rewrites
        # workspace protocols to concrete versions) and upload the tarball
        # with npm (which authenticates via trusted publishing when no token
        # is present).
        run: |
          set -euo pipefail
          # Dependency order: dependees before dependents.
          PACKAGES="core paywalls-js verify server paywalls-react"
          published=0
          for pkg in $PACKAGES; do
            dir="packages/$pkg"
            name=$(jq -r .name "$dir/package.json")
            version=$(jq -r .version "$dir/package.json")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "✓ $name@$version already on npm — skipping"
              continue
            fi
            # `--quiet` still prints a leading blank line — take the last line.
            tarball=$(cd "$dir" && bun pm pack --quiet | tail -n1)
            if [ "$DRY_RUN" = "1" ]; then
              echo "→ [dry run] would publish $name@$version"
              (cd "$dir" && npm publish "$tarball" --access public --dry-run)
            else
              echo "→ publishing $name@$version"
              (cd "$dir" && npm publish "$tarball" --access public)
              published=$((published + 1))
            fi
          done
          echo "Published $published package(s)."
